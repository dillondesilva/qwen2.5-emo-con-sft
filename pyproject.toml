[project]
name = "llm-emotions-post-training"
version = "0.1.0"
description = "Text SFT pipeline for liva-ai/emo-com supportive conversations"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0.0",
    "datasets>=3.0.0",
    "huggingface_hub>=0.26.0",
    "modal>=0.73.0",
    "peft>=0.14.0",
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "trl>=0.15.0",
]

[project.scripts]
emo-inspect = "emo_sft.inspect:main"
emo-prepare = "emo_sft.prepare:main"
emo-train = "emo_sft.train:main"
emo-train-modal = "emo_sft.modal_sft:main"
emo-chat = "emo_sft.chat:main"
emo-eval = "emo_sft.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emo_sft"]
